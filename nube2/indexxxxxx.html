<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huella energética de la nube</title>
  <style>
    /* Estilos base y variables de tema ambiental */
    :root {
      --bg-gradient-start: #e8f5e9;
      --bg-gradient-end: #c8e6c9;
      --card-bg: #ffffff;
      --primary: #2e7d32;
      --primary-hover: #1b5e20;
      --primary-disabled: #a5d6a7;
      --text-main: #1c311f;
      --text-muted: #4b6b4e;
      --border-color: #a3d9a5;
      --input-focus: #4caf50;
      --result-bg: #f1f8e9;
      --error-bg: #ffebee;
      --error-text: #c62828;
      --error-border: #ef9a9a;
      --shadow: 0 10px 25px -5px rgba(46, 125, 50, 0.1), 0 8px 10px -6px rgba(46, 125, 50, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }

    /* Contenedor principal */
    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 680px;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    /* Encabezado */
    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background-color: #e8f5e9;
      border-radius: 50%;
      margin-bottom: 1rem;
    }

    .icon-wrapper svg {
      width: 32px;
      height: 32px;
      fill: var(--primary);
    }

    h1 {
      font-size: 1.85rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    p.description {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* Grid de formulario responsive */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }

    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .field-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 0.4rem;
    }

    input[type="number"] {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 0.5rem;
      font-size: 1rem;
      color: var(--text-main);
      background-color: #fafafa;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--input-focus);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
    }

    /* Acciones del formulario */
    .form-actions {
      margin-top: 2rem;
    }

    button {
      width: 100%;
      padding: 0.9rem 1.5rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    button:disabled {
      background-color: var(--primary-disabled);
      cursor: not-allowed;
    }

    /* Recuadro de resultados */
    #resultado {
      display: none;
      margin-top: 2rem;
      padding: 1.25rem 1.5rem;
      border-radius: 0.75rem;
      font-size: 0.95rem;
      line-height: 1.6;
      white-space: pre-line;
      word-wrap: break-word;
      transition: all 0.3s ease;
    }

    #resultado.success {
      display: block;
      background-color: var(--result-bg);
      border: 1.5px solid var(--border-color);
      color: var(--text-main);
    }

    #resultado.error {
      display: block;
      background-color: var(--error-bg);
      border: 1.5px solid var(--error-border);
      color: var(--error-text);
    }
  </style>
</head>
<body>

  <main class="container">
    <header>
      <div class="icon-wrapper">
        <!-- Icono de Hoja / Eco -->
        <svg viewBox="0 0 24 24">
          <path d="M17,8C8,10 59,16.17 3.82,21.34L5.71,22L6.58,20.58C9.7,15.42 16.5,12 21.5,11.5L22,8.5M17,8C17,8 12.5,3 5.5,3C3.5,3 2,4.5 2,6.5C2,11.5 8.5,16 8.5,16C8.5,16 11,10.5 17,8Z"/>
        </svg>
      </div>
      <h1>Huella energética de la nube</h1>
      <p class="description">Cada acción digital se procesa en centros de datos que consumen energía; esta página estima tu huella.</p>
    </header>

    <form id="footprintForm" onsubmit="calcularHuella(event)">
      <div class="form-grid">
        <div class="field-group">
          <label for="video">Video en streaming (horas/día)</label>
          <input type="number" id="video" name="video" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="musica">Música en streaming (horas/día)</label>
          <input type="number" id="musica" name="musica" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="redes">Redes sociales (horas/día)</label>
          <input type="number" id="redes" name="redes" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="videollamadas">Videollamadas (horas/semana)</label>
          <input type="number" id="videollamadas" name="videollamadas" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="juegos">Juegos en línea (horas/día)</label>
          <input type="number" id="juegos" name="juegos" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="nube">Almacenamiento en la nube (GB)</label>
          <input type="number" id="nube" name="nube" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="ia">Consultas a chatbots de IA (al día)</label>
          <input type="number" id="ia" name="ia" min="0" value="0" required>
        </div>

        <div class="field-group">
          <label for="correos">Correos enviados (al día)</label>
          <input type="number" id="correos" name="correos" min="0" value="0" required>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" id="btnCalcular">
          <span>Calcular mi huella</span>
        </button>
      </div>
    </form>

    <!-- Recuadro para mostrar respuesta o errores -->
    <div id="resultado" aria-live="polite"></div>
  </main>

  <script>
    // Pega aquí tu URL de Make / Webhook
    const WEBHOOK_URL = "https://hook.us2.make.com/a7wl0u8jk25qyo4uf5zqv8xjxbw7t8in";

    async function calcularHuella(event) {
      event.preventDefault();

      const btn = document.getElementById("btnCalcular");
      const divResultado = document.getElementById("resultado");

      // Estado de carga UI
      btn.disabled = true;
      btn.textContent = "Calculando...";
      divResultado.className = "";
      divResultado.style.display = "none";
      divResultado.textContent = "";

      // Construcción del cuerpo con URLSearchParams
      const params = new URLSearchParams();
      params.append("video", document.getElementById("video").value || "0");
      params.append("musica", document.getElementById("musica").value || "0");
      params.append("redes", document.getElementById("redes").value || "0");
      params.append("videollamadas", document.getElementById("videollamadas").value || "0");
      params.append("juegos", document.getElementById("juegos").value || "0");
      params.append("nube", document.getElementById("nube").value || "0");
      params.append("ia", document.getElementById("ia").value || "0");
      params.append("correos", document.getElementById("correos").value || "0");

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          body: params
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        // Lectura como texto plano sin parsear a JSON
        const textData = await response.text();

        divResultado.textContent = textData;
        divResultado.className = "success";
      } catch (error) {
        console.error("Error al calcular la huella:", error);
        divResultado.textContent = "No se pudo calcular, intenta de nuevo.";
        divResultado.className = "error";
      } finally {
        // Restaurar estado del botón
        btn.disabled = false;
        btn.textContent = "Calcular mi huella";
      }
    }
  </script>
</body>
</html>
