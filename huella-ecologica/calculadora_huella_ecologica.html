<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora de huella ecológica</title>
<style>
:root{--verde:#1b5e20;--claro:#e8f5e9;--medio:#66bb6a;--texto:#1b2a1b;--fondo:#f4faf4;--card:#fff}
@media (prefers-color-scheme:dark){:root{--verde:#a5d6a7;--claro:#1c2b1e;--medio:#388e3c;--texto:#e6f2e6;--fondo:#101710;--card:#182118}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{color:var(--verde);margin:.2em 0}
h2{color:var(--verde);font-size:1.1rem;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--medio);border-radius:14px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label{display:block;font-size:.92rem;font-weight:600}
input,select{width:100%;padding:10px;margin-top:4px;border:1px solid var(--medio);border-radius:8px;font-size:1rem;background:var(--claro);color:var(--texto)}
button{margin-top:18px;width:100%;padding:14px;font-size:1.05rem;font-weight:700;border:0;border-radius:10px;background:var(--medio);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#resultado{white-space:pre-line;display:none;border-left:6px solid var(--medio);background:var(--claro)}
</style>
</head>
<body>
<main>
<h1>🌍 Calculadora de huella ecológica</h1>
<p>Si todos vivieran como tú, ¿cuántos planetas Tierra harían falta? Responde el cuestionario y descúbrelo.</p>

<div class="card">
<h2>🥗 Alimentación</h2>
<div class="grid">
<label>¿Cada cuánto comes carne de res o cerdo?
<select id="carne">
<option value="Nunca">Nunca</option>
<option value="1-2 veces por semana">1-2 veces por semana</option>
<option value="3-5 veces por semana">3-5 veces por semana</option>
<option value="Diario">Diario</option>
</select></label>
<label>¿Qué parte de tu comida es local o de temporada?
<select id="local">
<option value="Casi nada">Casi nada</option>
<option value="La mitad">La mitad</option>
<option value="Casi toda">Casi toda</option>
</select></label>
</div>
</div>

<div class="card">
<h2>🚌 Transporte</h2>
<div class="grid">
<label>Medio principal
<select id="transporte">
<option value="Caminar o bicicleta">Caminar o bicicleta</option>
<option value="Camion urbano">Camión urbano</option>
<option value="Moto">Moto</option>
<option value="Auto propio">Auto propio</option>
</select></label>
<label>Kilómetros que recorres al día
<input type="number" id="km" min="0" step="any" value="0"></label>
<label>Vuelos en avión al año
<input type="number" id="vuelos" min="0" step="1" value="0"></label>
</div>
</div>

<div class="card">
<h2>⚡ Energía</h2>
<div class="grid">
<label>Horas al día de aire acondicionado en casa
<input type="number" id="aire" min="0" max="24" step="any" value="0"></label>
<label>Personas que viven en tu casa
<input type="number" id="personas" min="1" step="1" value="1"></label>
</div>
</div>

<div class="card">
<h2>🛍️ Consumo</h2>
<div class="grid">
<label>Prendas nuevas que compras al mes
<input type="number" id="ropa" min="0" step="any" value="0"></label>
<label>Cada cuántos años cambias de celular
<input type="number" id="celular" min="0" step="any" value="2"></label>
</div>
</div>

<div class="card">
<h2>♻️ Residuos</h2>
<div class="grid">
<label>¿Separas la basura?
<select id="separa">
<option value="Si">Sí</option>
<option value="A veces">A veces</option>
<option value="No">No</option>
</select></label>
</div>
<button id="btn" type="button">Calcular mi huella</button>
</div>

<div class="card" id="resultado"></div>
</main>

<script>
// Pega aquí la URL del webhook de Make
const WEBHOOK_URL = "https://hook.us2.make.com/39n438g18i6j8dwrlr3ajtpfhtnw2mxe";

const campos = ["carne","local","transporte","km","vuelos","aire","personas","ropa","celular","separa"];
const numericos = ["km","vuelos","aire","personas","ropa","celular"];
const btn = document.getElementById("btn");
const caja = document.getElementById("resultado");

btn.addEventListener("click", async () => {
  const datos = new URLSearchParams();
  campos.forEach(c => {
    let v = document.getElementById(c).value;
    if (numericos.includes(c)) {
      const n = parseFloat(v);
      v = isNaN(n) || n < 0 ? 0 : n;
    }
    datos.append(c, v);
  });
  btn.disabled = true;
  btn.textContent = "Calculando tu huella...";
  caja.style.display = "block";
  caja.textContent = "Calculando tu huella...";
  try {
    const r = await fetch(WEBHOOK_URL, { method: "POST", body: datos });
    if (!r.ok) throw new Error("HTTP " + r.status);
    caja.textContent = await r.text();
  } catch (e) {
    caja.textContent = "No se pudo calcular, intenta de nuevo.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Calcular mi huella";
  }
});
</script>
</body>
</html>
